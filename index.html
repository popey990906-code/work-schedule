<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 일정표</title>
<link rel="icon" href="icon.ico">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #1c2430;
    font: 16px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #6b7482; margin: 6px 0; }
  button { margin-top: 16px; font: inherit; padding: 9px 18px; border-radius: 8px; border: 0;
    background: #2563eb; color: #fff; cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>업무 일정표</h1>
  <p id="msg">일정표에 연결하는 중입니다...</p>
  <p id="sub" hidden>관리자 PC에서 일정표 프로그램이 실행 중이어야 접속할 수 있습니다. 20초마다 자동으로 다시 시도합니다.</p>
  <button id="retry" hidden>다시 시도</button>
</main>
<script>
const REPO = 'popey990906-code/work-schedule';
const OK = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;

async function currentAddress() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/url.txt?t=${Date.now()}`,
      { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
    if (r.ok) return (await r.text()).trim();
  } catch {}
  const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/url.txt?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('address');
  return (await r.text()).trim();
}

async function connect() {
  const msg = document.getElementById('msg');
  document.getElementById('retry').hidden = true;
  msg.textContent = '일정표에 연결하는 중입니다...';
  try {
    const url = await currentAddress();
    if (!OK.test(url)) throw new Error('address');
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 10000);
    const r = await fetch(url + '/api/ping', { cache: 'no-store', signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('offline');
    location.replace(url);
  } catch {
    msg.textContent = '지금은 일정표가 꺼져 있습니다.';
    document.getElementById('sub').hidden = false;
    document.getElementById('retry').hidden = false;
    setTimeout(connect, 20000);
  }
}
document.getElementById('retry').addEventListener('click', connect);
connect();
</script>
</body>
</html>
